<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AnimeRank media pipeline">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#3a4358"/>
    </marker>
    <style>
      .box { fill:#10141d; stroke:#1f2735; stroke-width:1.5; rx:12; }
      .t   { font-family:'Segoe UI',Inter,system-ui,sans-serif; }
      .m   { font-family:'Cascadia Code',Consolas,monospace; }
      .flow { stroke:#2a3348; stroke-width:2; fill:none; marker-end:url(#arr); }
      .pulse { stroke:#e8003d; stroke-width:2; fill:none; stroke-dasharray:6 14; stroke-linecap:round; }
    </style>
  </defs>

  <rect width="1000" height="300" fill="#0d1117"/>
  <text x="34" y="40" class="t" font-size="14" font-weight="600" fill="#6b7488" letter-spacing="4">ANIMERANK · MEDIA PIPELINE</text>

  <!-- ana hat kutuları -->
  <g>
    <rect x="34"  y="70" width="160" height="76" rx="12" class="box"/>
    <text x="114" y="102" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#f0f3f9">P2P Swarm</text>
    <text x="114" y="124" text-anchor="middle" class="m" font-size="11" fill="#6b7488">multi-source ingest</text>

    <rect x="244" y="70" width="170" height="76" rx="12" class="box"/>
    <text x="329" y="102" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#f0f3f9">Verify &amp; Select</text>
    <text x="329" y="124" text-anchor="middle" class="m" font-size="11" fill="#6b7488">season-guard · quality score</text>

    <rect x="464" y="70" width="180" height="76" rx="12" class="box"/>
    <text x="554" y="102" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#f0f3f9">GPU Transcode</text>
    <text x="554" y="124" text-anchor="middle" class="m" font-size="11" fill="#6b7488">NVENC · 3-tier ladder</text>

    <rect x="694" y="70" width="150" height="76" rx="12" class="box"/>
    <text x="769" y="102" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#f0f3f9">HLS Packager</text>
    <text x="769" y="124" text-anchor="middle" class="m" font-size="11" fill="#6b7488">fMP4 · branded intro</text>

    <rect x="884" y="70" width="82" height="76" rx="12" fill="#160b12" stroke="#e8003d" stroke-width="1.5"/>
    <text x="925" y="102" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#e8003d">Player</text>
    <text x="925" y="124" text-anchor="middle" class="m" font-size="11" fill="#8b5560">hls.js</text>
  </g>

  <!-- ana hat okları + akan nabız -->
  <g>
    <path class="flow" d="M194 108 H240"/>
    <path class="flow" d="M414 108 H460"/>
    <path class="flow" d="M644 108 H690"/>
    <path class="flow" d="M844 108 H880"/>
    <path class="pulse" d="M194 108 H880">
      <animate attributeName="stroke-dashoffset" values="0;-200" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- yardımcı hatlar -->
  <g>
    <rect x="244" y="196" width="180" height="64" rx="12" class="box"/>
    <text x="334" y="222" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#f0f3f9">4K Restoration</text>
    <text x="334" y="242" text-anchor="middle" class="m" font-size="11" fill="#6b7488">AI upscale lane</text>

    <rect x="484" y="196" width="180" height="64" rx="12" class="box"/>
    <text x="574" y="222" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#f0f3f9">AI Subtitles</text>
    <text x="574" y="242" text-anchor="middle" class="m" font-size="11" fill="#6b7488">GPU batch translate</text>

    <path class="flow" d="M334 196 C334 168 400 150 460 132"/>
    <path class="flow" d="M574 196 C574 176 620 160 690 140"/>
  </g>

  <text x="966" y="282" text-anchor="end" class="m" font-size="11" fill="#3f4759">torrent-in → broadcast-grade out</text>
</svg>
