<svg width="1000" height="290" viewBox="0 0 1000 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Xaena53 — Full-Stack Developer, streaming and real-time systems">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#141b28" stroke-width="1"/>
    </pattern>
    <clipPath id="logClip"><rect x="632" y="94" width="308" height="98"/></clipPath>
    <style>
      .disp  { font-family: Georgia, 'Times New Roman', serif; }
      .lbl   { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .data  { font-family: 'SF Mono', Consolas, 'Cascadia Code', monospace; }

      @keyframes breathe  { 0%,100%{ opacity:.45; } 50%{ opacity:1; } }
      @keyframes pulseDot { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.5; transform:scale(.8); } }
      @keyframes scrollLog{ 0%{ transform:translateY(0); } 100%{ transform:translateY(-126px); } }
      @keyframes blinkCur { 0%,100%{ opacity:1; } 50%{ opacity:0; } }

      .reg       { animation: breathe 4.5s ease-in-out infinite; }
      .reg:nth-of-type(2) { animation-delay: 1.1s; }
      .reg:nth-of-type(3) { animation-delay: 2.2s; }
      .reg:nth-of-type(4) { animation-delay: 3.3s; }
      .marker    { animation: pulseDot 2.6s ease-in-out infinite; transform-origin: 243.5px 186px; }
      .logscroll { animation: scrollLog 9s linear infinite; }
      .cursor    { animation: blinkCur 1s step-end infinite; }

      @media (prefers-reduced-motion: reduce) { *{ animation:none !important; } }
    </style>
  </defs>

  <rect width="1000" height="290" fill="#0a0d13"/>
  <rect width="1000" height="290" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="289" fill="none" stroke="#1c2534" stroke-width="1"/>

  <text x="56" y="54" class="lbl" font-size="11" font-weight="600" fill="#5c6579" letter-spacing="3">IDENTIFICATION — GITHUB / XAENA53</text>

  <text x="54" y="128" class="disp" font-size="66" font-weight="700" fill="#eef1f6" letter-spacing="-1.5">Xaena53</text>
  <text x="56" y="160" class="lbl" font-size="14" font-weight="600" fill="#e0576e" letter-spacing="3">FULL-STACK DEVELOPER</text>

  <g stroke="#2a3548" stroke-width="1">
    <line x1="56" y1="182" x2="56" y2="190"/>
    <line x1="56" y1="186" x2="430" y2="186"/>
    <line x1="430" y1="182" x2="430" y2="190"/>
  </g>
  <rect class="marker" x="240" y="182.5" width="7" height="7" fill="#e8003d" transform="rotate(45 243.5 186)"/>

  <text x="56" y="214" class="lbl" font-size="13.5" fill="#8993a8">Streaming platforms, real-time systems and media pipelines —</text>
  <text x="56" y="234" class="lbl" font-size="13.5" fill="#8993a8">architected, transcoded and shipped end to end.</text>

  <!-- canlı build kaydı: gerçek bir tail -f gibi sürekli yukarı akan log paneli -->
  <g>
    <line x1="620" y1="70" x2="620" y2="200" stroke="#1c2534" stroke-width="1"/>
    <rect x="632" y="94" width="308" height="98" fill="none" stroke="#1c2534" stroke-width="1"/>
    <text x="632" y="86" class="data" font-size="10" fill="#4d5567">BUILD LOG — tail -f</text>
    <rect class="cursor" x="880" y="76" width="6" height="11" fill="#e8003d"/>

    <g clip-path="url(#logClip)">
      <g class="logscroll">
        <g class="data" font-size="10.5">
          <text x="640" y="110"><tspan fill="#e8003d">[gpu]</tspan><tspan fill="#9aa3b3"> nvenc session acquired</tspan></text>
          <text x="640" y="128"><tspan fill="#e8003d">[p2p]</tspan><tspan fill="#9aa3b3"> swarm handshake · 41 peers</tspan></text>
          <text x="640" y="146"><tspan fill="#e8003d">[hls]</tspan><tspan fill="#9aa3b3"> ladder 1080/720/480 queued</tspan></text>
          <text x="640" y="164"><tspan fill="#e8003d">[hls]</tspan><tspan fill="#9aa3b3"> segment 0182 written</tspan></text>
          <text x="640" y="182"><tspan fill="#e8003d">[cdn]</tspan><tspan fill="#9aa3b3"> edge cache warm</tspan></text>
          <text x="640" y="200"><tspan fill="#7a9a7f">[ok]</tspan><tspan fill="#9aa3b3">  pipeline complete · 3.2s</tspan></text>
          <text x="640" y="218"><tspan fill="#e8003d">[git]</tspan><tspan fill="#9aa3b3"> deploy tagged v9.4.1</tspan></text>
        </g>
        <g class="data" font-size="10.5" transform="translate(0,126)">
          <text x="640" y="110"><tspan fill="#e8003d">[gpu]</tspan><tspan fill="#9aa3b3"> nvenc session acquired</tspan></text>
          <text x="640" y="128"><tspan fill="#e8003d">[p2p]</tspan><tspan fill="#9aa3b3"> swarm handshake · 41 peers</tspan></text>
          <text x="640" y="146"><tspan fill="#e8003d">[hls]</tspan><tspan fill="#9aa3b3"> ladder 1080/720/480 queued</tspan></text>
          <text x="640" y="164"><tspan fill="#e8003d">[hls]</tspan><tspan fill="#9aa3b3"> segment 0182 written</tspan></text>
          <text x="640" y="182"><tspan fill="#e8003d">[cdn]</tspan><tspan fill="#9aa3b3"> edge cache warm</tspan></text>
          <text x="640" y="200"><tspan fill="#7a9a7f">[ok]</tspan><tspan fill="#9aa3b3">  pipeline complete · 3.2s</tspan></text>
          <text x="640" y="218"><tspan fill="#e8003d">[git]</tspan><tspan fill="#9aa3b3"> deploy tagged v9.4.1</tspan></text>
        </g>
      </g>
    </g>
    <rect x="632" y="94" width="308" height="14" fill="#0a0d13"/>
    <rect x="632" y="178" width="308" height="14" fill="url(#fadeBottom)"/>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d13" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0d13" stop-opacity="1"/>
    </linearGradient>
  </g>

  <g>
    <rect x="782" y="228" width="162" height="42" fill="none" stroke="#232d3f" stroke-width="1"/>
    <line x1="782" y1="242" x2="944" y2="242" stroke="#232d3f" stroke-width="1"/>
    <text x="790" y="238" class="data" font-size="9" fill="#5c6579">DWG NO.</text>
    <text x="936" y="238" class="data" font-size="9" fill="#8993a8" text-anchor="end">XR-001</text>
    <text x="790" y="256" class="data" font-size="9" fill="#5c6579">SHEET</text>
    <text x="936" y="256" class="data" font-size="9" fill="#8993a8" text-anchor="end">PROFILE · REV 07.26</text>
  </g>

  <g stroke="#2a3548" stroke-width="1.25">
    <path class="reg" d="M20 12 h14 M12 20 v14" fill="none"/>
    <path class="reg" d="M980 12 h-14 M988 20 v14" fill="none"/>
    <path class="reg" d="M20 278 h14 M12 270 v-14" fill="none"/>
    <path class="reg" d="M980 278 h-14 M988 270 v-14" fill="none"/>
  </g>
</svg>
