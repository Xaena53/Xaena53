<svg width="1000" height="580" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technology stack — skills portfolio">
  <defs>
    <pattern id="g5" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#131a26" stroke-width="1"/>
    </pattern>
    <clipPath id="sweepClip"><rect x="32" y="90" width="936" height="430"/></clipPath>
    <style>
      .lbl  { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
      .data { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; }
      .mono { font-family:Georgia,'Times New Roman',serif; }

      @keyframes sweepY { 0%{ transform:translateY(0); opacity:0; } 3%{ opacity:.8; } 92%{ opacity:.8; } 100%{ transform:translateY(430px); opacity:0; } }
      .sweep { animation: sweepY 14s ease-in-out infinite; }

      @keyframes breathe { 0%,100%{ opacity:.45; } 50%{ opacity:1; } }
      .reg { animation: breathe 4.5s ease-in-out infinite; }
      .reg:nth-of-type(2) { animation-delay: 1.1s; }
      .reg:nth-of-type(3) { animation-delay: 2.2s; }
      .reg:nth-of-type(4) { animation-delay: 3.3s; }

      @keyframes frameScan { to { stroke-dashoffset:-2680; } }
      .frameScan { stroke-dasharray:140 2540; animation: frameScan 9s linear infinite; }

      @keyframes chipIn { 0%{ opacity:0; } 100%{ opacity:1; } }
      .chip { animation: chipIn 0.5s ease-out both; }

      @media (prefers-reduced-motion: reduce) { *{ animation:none !important; } }
    </style>
  </defs>

