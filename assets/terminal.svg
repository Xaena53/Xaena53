<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="terminal summary">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11141f"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
  </defs>

  <!-- pencere -->
  <rect x="2" y="2" width="996" height="326" rx="14" fill="url(#tbg)" stroke="#232a3d" stroke-width="1.5"/>
  <!-- başlık çubuğu -->
  <rect x="2" y="2" width="996" height="40" rx="14" fill="#151927"/>
  <rect x="2" y="28" width="996" height="14" fill="#151927"/>
  <circle cx="30" cy="22" r="6.5" fill="#ff5f57"/>
  <circle cx="52" cy="22" r="6.5" fill="#febc2e"/>
  <circle cx="74" cy="22" r="6.5" fill="#28c840"/>
  <text x="500" y="27" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#6b7488">xaena@github: ~/profile</text>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="15">
    <!-- satır 1 -->
    <text x="34" y="78"><tspan fill="#00c2d4">❯</tspan> <tspan fill="#e6e9f2">whoami</tspan></text>
    <text x="34" y="104" fill="#9aa3b8">Xaena53 — full-stack developer, product-minded builder</text>

    <!-- satır 2 -->
    <text x="34" y="142"><tspan fill="#00c2d4">❯</tspan> <tspan fill="#e6e9f2">cat focus.txt</tspan></text>
    <text x="34" y="168" fill="#9aa3b8">Streaming infrastructure · HLS/P2P media pipelines · real-time apps</text>
