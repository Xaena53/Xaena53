    <!-- satır 3 -->
    <text x="34" y="230"><tspan fill="#00c2d4">❯</tspan> <tspan fill="#e6e9f2">status --now</tspan></text>
    <text x="34" y="256"><tspan fill="#28c840">●</tspan> <tspan fill="#9aa3b8">building</tspan> <tspan fill="#e8003d" font-weight="700">AnimeRank</tspan> <tspan fill="#9aa3b8">— a full-scale anime streaming platform</tspan></text>

    <!-- imleç -->
    <text x="34" y="296"><tspan fill="#00c2d4">❯</tspan></text>
    <rect x="52" y="283" width="9" height="17" fill="#e6e9f2">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
