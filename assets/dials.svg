  <text x="404" y="236" text-anchor="middle" class="lbl" font-size="9.5" fill="#5c6579">multi-pass capture</text>
  <text x="404" y="249" text-anchor="middle" class="lbl" font-size="9.5" fill="#5c6579">target 85%</text>
