<svg width="1000" height="306" viewBox="0 0 1000 306" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telemetry dials — measured ratios, and the language mix across repositories">
  <defs>
    <pattern id="gdi" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#131a26" stroke-width="1"/></pattern>
    <style>
      .lbl{font-family:'Segoe UI',Helvetica,Arial,sans-serif;}
      .data{font-family:'SF Mono',Consolas,'Cascadia Code',monospace;}
      .title{font-family:'Segoe UI Semibold','Segoe UI',Helvetica,Arial,sans-serif;font-weight:600;}
      .disp{font-family:Georgia,'Times New Roman',serif;}
      @keyframes dol{from{stroke-dashoffset:var(--L);}} .yay{animation:dol 2.2s cubic-bezier(.2,.7,.2,1) both;} @keyframes nefes{0%,100%{opacity:.35;}50%{opacity:1;}} .uc{animation:nefes 2.6s ease-in-out infinite;}
      @media (prefers-reduced-motion: reduce){*{animation:none !important;}}
    </style>
  </defs>
  <rect width="1000" height="306" fill="#0a0d13"/>
  <rect width="1000" height="306" fill="url(#gdi)"/>
  <rect x="0.5" y="0.5" width="999" height="305" fill="none" stroke="#1c2534"/>
  <rect x="42" y="31" width="6" height="6" fill="#e8003d"/>
