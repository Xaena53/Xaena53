  <text x="554" y="236" text-anchor="middle" class="lbl" font-size="9.5" fill="#5c6579">UE5 automation tests passing</text>
  <text x="42" y="284" class="lbl" font-size="9.5" fill="#5c6579">White tick marks a target. Every value comes from a test run or an evaluation on held-out data.</text>
