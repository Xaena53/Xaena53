<text x="56" y="161" class="lbl" font-size="9.5" fill="#5c6579">CAMARA SIM-swap · fail-closed</text>
<rect x="512" y="132" width="446" height="36" fill="#0e131d" stroke="#243044"/>
<rect x="512" y="132" width="3" height="36" fill="#e8003d"/>
<text x="526" y="148" class="data" font-size="10" fill="#e6e9ef" letter-spacing="1">THE SERVER ASKS THE HUMAN</text>
<text x="526" y="161" class="lbl" font-size="9.5" fill="#5c6579">MCP elicitation · the agent's own flag is ignored</text>
<rect x="42" y="178" width="446" height="36" fill="#0e131d" stroke="#243044"/>
<rect x="42" y="178" width="3" height="36" fill="#e8003d"/>
<text x="56" y="194" class="data" font-size="10" fill="#e6e9ef" letter-spacing="1">CAMPAIGNS START PAUSED</text>
<text x="56" y="207" class="lbl" font-size="9.5" fill="#5c6579">on Google Ads and on Meta</text>
<rect x="512" y="178" width="446" height="36" fill="#0e131d" stroke="#243044"/>
<rect x="512" y="178" width="3" height="36" fill="#e8003d"/>
<text x="526" y="194" class="data" font-size="10" fill="#e6e9ef" letter-spacing="1">OWNER SETS THE CEILING</text>
<text x="526" y="207" class="lbl" font-size="9.5" fill="#5c6579">raises need consent · cuts go through</text>
<text x="42" y="252" class="data" font-size="16" fill="#e6e9ef">1,765</text>
<text x="42" y="266" class="lbl" font-size="10" fill="#5c6579">automated tests</text>
<text x="277" y="252" class="data" font-size="16" fill="#e6e9ef">83%</text>
<text x="277" y="266" class="lbl" font-size="10" fill="#5c6579">line coverage</text>
