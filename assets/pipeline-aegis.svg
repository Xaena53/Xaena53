<text x="512" y="266" class="lbl" font-size="10" fill="#5c6579">integrations called live</text>
<text x="747" y="252" class="data" font-size="16" fill="#e6e9ef">AGPL-3.0</text>
<text x="747" y="266" class="lbl" font-size="10" fill="#5c6579">open source</text>
<text x="42" y="288" class="lbl" font-size="10" fill="#5c6579">Shortlisted at the GSMA MENA Ignite hackathon · Google Ads, Meta and five of six CAMARA links verified against the real APIs (Nokia Network-as-Code, simulator mode)</text>
