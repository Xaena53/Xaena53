<text x="42" y="86" class="disp" font-size="21" fill="#e6e9ef">Aegis</text>
<text x="42" y="106" class="lbl" font-size="11.5" fill="#8b93a7">An MCP server that runs real Google Ads and Meta campaigns and asks the mobile network about the approver before money moves</text>
<rect x="42" y="132" width="446" height="36" fill="#0e131d" stroke="#243044"/>
<rect x="42" y="132" width="3" height="36" fill="#e8003d"/>
