      .pn   { fill:#6b7488; }
      @keyframes clipL1 { 0%{width:0;} 0.9%{width:0;animation-timing-function:steps(53,end);} 13.6%{width:395px;} 100%{width:395px;} }
      @keyframes clipL2 { 0%{width:0;} 14.5%{width:0;animation-timing-function:steps(44,end);} 25.1%{width:328px;} 100%{width:328px;} }
      @keyframes clipL3 { 0%{width:0;} 26.0%{width:0;animation-timing-function:steps(45,end);} 36.8%{width:335px;} 100%{width:335px;} }
