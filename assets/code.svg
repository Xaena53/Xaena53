  <text x="32" y="38" class="data" font-size="10.5" fill="#5c6579" letter-spacing="3">09 — LIVE BUILD</text>
  <text x="32" y="60" class="lbl" font-size="18" font-weight="700" fill="#eef1f6">onayAl() — the Aegis approval gate</text>
  <text x="32" y="80" class="lbl" font-size="12" fill="#8993a8">simplified from src/approval.ts · the network is asked first, then the human, and the agent's own flag comes last</text>

  <rect x="32" y="98" width="936" height="234" fill="#0d1119" stroke="#232d3f" stroke-width="1"/>
  <path d="M32 98h10M32 98v10M968 98h-10M968 98v10M32 332h10M32 332v-10M968 332h-10M968 332v-10" stroke="#3a4560" stroke-width="1" fill="none"/>
  <text x="52" y="98" class="data" font-size="9" fill="#4d5567" transform="translate(0,-4)">approval.ts</text>

  <g class="body">
    <g clip-path="url(#cl1)"><text x="56" y="132" class="data" font-size="13" xml:space="preserve"><tspan class="kw">export async function </tspan><tspan class="fn">onayAl</tspan><tspan class="pn">(server, ozet, confirm) {</tspan></text></g>
    <g clip-path="url(#cl2)"><text x="56" y="154" class="data" font-size="13" xml:space="preserve"><tspan class="pn">  </tspan><tspan class="kw">const</tspan><tspan class="pn"> net = </tspan><tspan class="kw">await </tspan><tspan class="fn">networkTrust</tspan><tspan class="pn">(ozet.risk);</tspan></text></g>
    <g clip-path="url(#cl3)"><text x="56" y="176" class="data" font-size="13" xml:space="preserve"><tspan class="pn">  </tspan><tspan class="kw">if</tspan><tspan class="pn"> (net.swapped) </tspan><tspan class="kw">return </tspan><tspan class="fn">refuse</tspan><tspan class="pn">(</tspan><tspan class="str">'sim-swap'</tspan><tspan class="pn">);</tspan></text></g>
    <g clip-path="url(#cl4)"><text x="56" y="198" class="data" font-size="13" xml:space="preserve"><tspan class="pn">  </tspan><tspan class="kw">if</tspan><tspan class="pn"> (</tspan><tspan class="fn">canElicit</tspan><tspan class="pn">(server))</tspan></text></g>
    <g clip-path="url(#cl5)"><text x="56" y="220" class="data" font-size="13" xml:space="preserve"><tspan class="pn">    </tspan><tspan class="kw">return </tspan><tspan class="fn">askHuman</tspan><tspan class="pn">(server, ozet);</tspan></text></g>
    <g clip-path="url(#cl6)"><text x="56" y="242" class="data" font-size="13" xml:space="preserve"><tspan class="pn">  </tspan><tspan class="kw">if</tspan><tspan class="pn"> (!confirm) </tspan><tspan class="kw">return </tspan><tspan class="fn">refuse</tspan><tspan class="pn">(</tspan><tspan class="str">'no-consent'</tspan><tspan class="pn">);</tspan></text></g>
    <g clip-path="url(#cl7)"><text x="56" y="264" class="data" font-size="13" xml:space="preserve"><tspan class="pn">  </tspan><tspan class="kw">return </tspan><tspan class="fn">approve</tspan><tspan class="pn">(</tspan><tspan class="str">'confirm'</tspan><tspan class="pn">, net);</tspan></text></g>
    <g clip-path="url(#cl8)"><text x="56" y="286" class="data" font-size="13" xml:space="preserve"><tspan class="pn">}</tspan></text></g>
    <text x="944" y="132" text-anchor="end" class="data" font-size="10" fill="#3f4759">1</text>
