<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nöbetçi Memur — a document-inspection game set in a 1984 registry office, playable in the browser">
  <defs>
    <pattern id="g6n" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#131a26" stroke-width="1"/>
    </pattern>
    <style>
      .lbl { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
      .data { font-family:'SF Mono',Consolas,'Cascadia Code',monospace; }
      .title { font-family:'Segoe UI Semibold','Segoe UI',Helvetica,Arial,sans-serif; font-weight:600; }
      .disp { font-family:Georgia,'Times New Roman',serif; }
      @keyframes flow{0%{stroke-dashoffset:14}100%{stroke-dashoffset:0}} .fl{stroke-dasharray:5 9;animation:flow 1.4s linear infinite}
      @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
    </style>
  </defs>
  <rect width="1000" height="300" fill="#0a0d13"/>
  <rect width="1000" height="300" fill="url(#g6n)"/>
  <rect x="0.5" y="0.5" width="999" height="299" fill="none" stroke="#1c2534"/>
  <rect x="42" y="31" width="6" height="6" fill="#e8003d"/>
  <text x="58" y="38" class="data" font-size="10.5" fill="#5c6579" letter-spacing="3">06 — NÖBETÇİ MEMUR · PLAYABLE IN THE BROWSER</text>
  <line x1="32" y1="56" x2="968" y2="56" stroke="#232d3f" stroke-width="1"/>

<text x="42" y="86" class="disp" font-size="21" fill="#e6e9ef">Nöbetçi Memur</text>
<text x="42" y="106" class="lbl" font-size="11.5" fill="#8b93a7">A document-inspection game: window 2 of a small-town registry office, January 1984 · seven working days, seven endings</text>
<rect x="42" y="132" width="190" height="54" fill="#0e131d" stroke="#243044"/>
<rect x="42" y="132" width="3" height="54" fill="#e8003d"/>
<text x="56" y="154" class="title" font-size="12" fill="#e6e9ef" letter-spacing="1.2">READ</text>
<text x="56" y="171" class="data" font-size="9.5" fill="#5c6579">papers slide onto the desk</text>
<rect x="256" y="132" width="190" height="54" fill="#0e131d" stroke="#243044"/>
<rect x="256" y="132" width="3" height="54" fill="#e8003d"/>
<text x="270" y="154" class="title" font-size="12" fill="#e6e9ef" letter-spacing="1.2">COMPARE</text>
<text x="270" y="171" class="data" font-size="9.5" fill="#5c6579">click two facts · a line is drawn</text>
<rect x="470" y="132" width="190" height="54" fill="#0e131d" stroke="#243044"/>
<rect x="470" y="132" width="3" height="54" fill="#e8003d"/>
<text x="484" y="154" class="title" font-size="12" fill="#e6e9ef" letter-spacing="1.2">DECIDE</text>
<text x="484" y="171" class="data" font-size="9.5" fill="#5c6579">approve · reject · refer</text>
<rect x="684" y="132" width="190" height="54" fill="#0e131d" stroke="#243044"/>
<rect x="684" y="132" width="3" height="54" fill="#e8003d"/>
<text x="698" y="154" class="title" font-size="12" fill="#e6e9ef" letter-spacing="1.2">GO HOME</text>
<text x="698" y="171" class="data" font-size="9.5" fill="#5c6579">rent · coal · food · medicine</text>
<line class="fl" x1="232" y1="159" x2="256" y2="159" stroke="#e8003d" stroke-width="1.6"/>
<line class="fl" x1="446" y1="159" x2="470" y2="159" stroke="#e8003d" stroke-width="1.6"/>
<line class="fl" x1="660" y1="159" x2="684" y2="159" stroke="#e8003d" stroke-width="1.6"/>
<rect x="874" y="132" width="84" height="54" fill="#0e131d" stroke="#243044"/>
<text x="916" y="154" text-anchor="middle" class="title" font-size="12" fill="#e6e9ef">ENDING</text>
<text x="916" y="171" text-anchor="middle" class="data" font-size="9" fill="#5c6579">1 of 7</text>
<line class="fl" x1="850" y1="159" x2="874" y2="159" stroke="#e8003d" stroke-width="1.6"/>
<text x="42" y="222" class="data" font-size="16" fill="#e6e9ef">4,322</text>
<text x="42" y="236" class="lbl" font-size="10" fill="#5c6579">automated robustness checks</text>
<text x="277" y="222" class="data" font-size="16" fill="#e6e9ef">955</text>
<text x="277" y="236" class="lbl" font-size="10" fill="#5c6579">strings · Turkish, English, Russian</text>
<text x="512" y="222" class="data" font-size="16" fill="#e6e9ef">89</text>
<text x="512" y="236" class="lbl" font-size="10" fill="#5c6579">citizens with a fixed identity</text>
<text x="747" y="222" class="data" font-size="16" fill="#e6e9ef">7 × 7</text>
<text x="747" y="236" class="lbl" font-size="10" fill="#5c6579">working days × endings</text>
<line x1="32" y1="254" x2="968" y2="254" stroke="#161d2b"/>
<circle cx="46" cy="272" r="3.5" fill="#2e9e4f"/>
<text x="58" y="276" class="lbl" font-size="10.5" fill="#8b93a7">Godot 4.3 · GDScript · rules and people in JSON · Windows build and a WebAssembly build served from GitHub Pages</text>
<text x="958" y="276" text-anchor="end" class="data" font-size="9" fill="#5c6579" letter-spacing="1">PLAYABLE</text>
</svg>