name: telemetry
# PAUSED by default (workflow_dispatch only — no cron). Reason: the default
# `secrets.GITHUB_TOKEN` is scoped to THIS repo only, so it undercounts repos
# and stars owned elsewhere on the account (confirmed: returned 2 repos / 0
# stars against a real 6 / 2). To get accurate cross-repo numbers AND run
# this automatically, add a classic Personal Access Token with `public_repo`
# + `read:user` scope as a repo secret named TELEMETRY_PAT (Settings →
# Secrets and variables → Actions → New repository secret), then:
#   1. swap `secrets.GITHUB_TOKEN` below for `secrets.TELEMETRY_PAT`
#   2. uncomment the `schedule:` trigger
# Until then, run manually via Actions tab whenever repo/star counts change.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 4 * * *"   # her gün 07:00 TR — TELEMETRY_PAT eklenince ac

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-telemetry.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if changed
        run: |
          git config user.name "telemetry-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --quiet assets/telemetry.svg && exit 0
          git add assets/telemetry.svg
          git commit -m "chore: refresh telemetry sheet [skip ci]"
          git push
